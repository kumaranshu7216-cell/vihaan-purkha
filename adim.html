<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Hub | VratyaVani AI Verification Desk</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    .admin-container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 28px;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 4px 25px rgba(0,0,0,0.06);
      border: 1px solid var(--border-color);
    }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 18px;
    }
    .admin-header h2 {
      font-family: 'Cinzel', serif;
      font-size: 24px;
      color: var(--primary-deep);
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 18px;
    }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 13px; font-weight: 600; }
    .form-group input, .form-group select, .form-group textarea {
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-family: inherit;
      font-size: 13px;
    }
    .btn-submit {
      margin-top: 20px;
      padding: 12px 24px;
      background: var(--primary-deep);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-submit:hover { background: #2e287a; }
    .records-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 24px;
      font-size: 13px;
    }
    .records-table th, .records-table td {
      border: 1px solid var(--border-color);
      padding: 12px 14px;
      text-align: left;
    }
    .records-table th {
      background: #f8fafc;
      font-weight: 700;
    }
    .badge-category {
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .badge-category.major { background: #e0e7ff; color: #3730a3; }
    .badge-category.monument { background: #fef3c7; color: #92400e; }
    .badge-category.gem { background: #e0f2fe; color: #0369a1; }
    .badge-category.artisan { background: #dcfce7; color: #166534; }
    .badge-status { color: #15803d; font-weight: 700; font-size: 12px; }
    .btn-delete {
      background: #fee2e2;
      color: #991b1b;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
    }
  </style>
</head>
<body style="background: #f1f5f9;">

  <div class="admin-container">
    <div class="admin-header">
      <div>
        <h2>🏛️ VratyaVani Verification & Curation Desk</h2>
        <p style="margin-top: 4px; font-size: 13px; color: var(--text-muted);">
          डिस्ट्रिक्ट हेरिटेज हब, अनडिस्कवर्ड रत्न व वोकल फॉर लोकल कारीगर डेटा प्रबंधन
        </p>
      </div>
      <a href="index.html" class="tab-btn" style="text-decoration:none; display:inline-block;">← मुख्य पोर्टल</a>
    </div>

    <!-- Heritage / Artisan Add Form -->
    <h3 style="margin-top: 26px; font-size: 17px;">नया हेरिटेज या शिल्पकार रिकॉर्ड सत्यापित करें</h3>
    <form id="addRecordForm">
      <div class="form-grid">
        <div class="form-group">
          <label>श्रेणी (Category)</label>
          <select id="recCat" required>
            <option value="major">प्रमुख धरोहर (Major Heritage)</option>
            <option value="monument">स्मारक (Monument)</option>
            <option value="gem">छिपे रत्न (Undiscovered Gem)</option>
            <option value="artisan">स्थानीय शिल्पकार (Local Artisan)</option>
          </select>
        </div>
        <div class="form-group">
          <label>ज़िला (District)</label>
          <select id="recDistrict" required>
            <option value="muzaffarpur">मुजफ्फरपुर (तिरहुत)</option>
            <option value="patna">पटना (पाटलिपुत्र)</option>
            <option value="varanasi">वाराणसी (काशी)</option>
            <option value="amritsar">अमृतसर (पंजाब)</option>
          </select>
        </div>
        <div class="form-group">
          <label>धरोहर / शिल्पी का नाम</label>
          <input type="text" id="recTitle" placeholder="उदा. सिकंदरपुर नौकायन केंद्र" required />
        </div>
        <div class="form-group">
          <label>अक्षांश, देशांतर (Lat, Lng)</label>
          <input type="text" id="recCoords" placeholder="उदा. 26.1209, 85.3647" required />
        </div>
        <div class="form-group">
          <label>व्हाट्सएप नंबर (कारीगर हेतु)</label>
          <input type="tel" id="recPhone" placeholder="919876543210" />
        </div>
        <div class="form-group" style="grid-column: 1 / -1;">
          <label>विवरण (भाषिणी AI ऑडियो स्क्रिप्ट)</label>
          <textarea id="recDesc" rows="3" placeholder="धरोहर का ऐतिहासिक संदर्भ लिखें जिसे AI ऑडियो गाइड में सुनाया जाएगा..." required></textarea>
        </div>
      </div>
      <button type="submit" class="btn-submit">सत्यापित करें एवं लाइव प्रकाशित करें (Verify & Publish)</button>
    </form>

    <!-- Verified Live Table -->
    <h3 style="margin-top: 36px; font-size: 17px;">सत्यापित लाइव डायरेक्ट्री (data.js + LocalStorage)</h3>
    <table class="records-table">
      <thead>
        <tr>
          <th>नाम</th>
          <th>ज़िला</th>
          <th>श्रेणी</th>
          <th>स्रोत / स्थिति</th>
          <th>कार्रवाई</th>
        </tr>
      </thead>
      <tbody id="recordsTbody"></tbody>
    </table>
  </div>

  <script src="data.js"></script>
  <script src="admin.js"></script>
</body>
</html>
