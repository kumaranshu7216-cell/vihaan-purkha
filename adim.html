<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>विहान पुरखा - एडमिन कंसोल</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: #f8fafc; 
            padding: 16px; 
            margin: 0; 
        }
        .admin-card { 
            background: white; 
            max-width: 460px; 
            margin: 15px auto; 
            padding: 24px; 
            border-radius: 18px; 
            box-shadow: 0 6px 20px rgba(0,0,0,0.06); 
            border: 1px solid #e2e8f0;
        }
        .logo-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .logo-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            overflow: hidden;
        }
        h2 { color: #0f172a; margin: 0; font-size: 1.4rem; font-weight: 800; }
        .sub { font-size: 0.8rem; color: #64748b; margin: 0; }
        
        label { font-size: 12px; font-weight: 700; color: #334155; display: block; margin-top: 10px; margin-bottom: 4px; }
        input, select, textarea { 
            width: 100%; 
            padding: 10px 12px; 
            border: 1px solid #cbd5e1; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 13px; 
            outline: none; 
        }
        input:focus, textarea:focus, select:focus { border-color: #d35400; }
        .row-grid { display: flex; gap: 8px; }
        .row-grid div { flex: 1; }
        
        .upload-preview {
            width: 100%;
            height: 140px;
            border: 2px dashed #cbd5e1;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 6px;
            overflow: hidden;
            background: #f8fafc;
        }
        .upload-preview img { width: 100%; height: 100%; object-fit: cover; display: none; }
        
        button { 
            width: 100%; 
            padding: 13px; 
            margin-top: 18px; 
            background: linear-gradient(135deg, #d35400, #e67e22); 
            color: white; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-weight: 700; 
            font-size: 15px; 
            box-shadow: 0 4px 12px rgba(211, 84, 0, 0.25); 
        }
        #msg { color: #16a34a; text-align: center; display: none; margin-top: 12px; font-weight: 700; font-size: 13px; }
    </style>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="admin-card">
        <div class="logo-box">
            <div class="logo-icon">
                <svg viewBox="0 0 500 500" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="opt2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#1e293b"/>
                            <stop offset="100%" stop-color="#0f172a"/>
                        </linearGradient>
                        <linearGradient id="opt2Ring" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#e67e22"/>
                            <stop offset="100%" stop-color="#f39c12"/>
                        </linearGradient>
                    </defs>
                    <rect width="500" height="500" rx="110" fill="url(#opt2Bg)"/>
                    <circle cx="250" cy="250" r="170" fill="none" stroke="url(#opt2Ring)" stroke-width="14" stroke-dasharray="24 12"/>
                    <circle cx="250" cy="250" r="130" fill="#d35400" opacity="0.25"/>
                    <text x="250" y="295" font-family="sans-serif" font-size="160" font-weight="900" fill="#f39c12" text-anchor="middle">वि</text>
                </svg>
            </div>
            <div>
                <h2>विहान पुरखा</h2>
                <p class="sub">एडमिन मैनेजमेंट कंसोल</p>
            </div>
        </div>

        <label>एडमिन हैंडल</label>
        <input type="text" id="adminId" value="@spidey_ahamiyat" required>

        <label>स्थान ID (Unique ID जैसे: garibnath_mandir)</label>
        <input type="text" id="placeId" placeholder="garibnath_mandir" required>

        <label>स्थान का नाम</label>
        <input type="text" id="placeName" placeholder="बाबा गरीबनाथ मंदिर" required>

        <div class="row-grid">
            <div>
                <label>राज्य (State)</label>
                <select id="placeState" onchange="updateDistrictOptions()">
                    <option value="Bihar">Bihar</option>
                    <option value="Punjab">Punjab</option>
                    <option value="Uttar Pradesh">Uttar Pradesh</option>
                </select>
            </div>
            <div>
                <label>ज़िला (District)</label>
                <select id="placeDistrict">
                    <option value="Muzaffarpur">Muzaffarpur</option>
                    <option value="Patna">Patna</option>
                    <option value="Gaya">Gaya</option>
                    <option value="Darbhanga">Darbhanga</option>
                    <option value="Bhagalpur">Bhagalpur</option>
                    <option value="Vaishali">Vaishali</option>
                </select>
            </div>
        </div>

        <label>गाँव / मोहल्ला / इलाका</label>
        <input type="text" id="placeVillage" placeholder="पुरानी बाज़ार" required>

        <label>स्थान की फ़ोटो अपलोड करें</label>
        <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)">
        <div class="upload-preview" id="previewContainer">
            <span id="previewPlaceholder" style="color: #94a3b8; font-size: 12px;">फ़ोटो चुनें</span>
            <img id="imgPreview" alt="Preview">
        </div>

        <label>श्रेणी (Category)</label>
        <select id="placeCategory">
            <option value="धार्मिक स्थल">धार्मिक स्थल</option>
            <option value="ऐतिहासिक स्थल">ऐतिहासिक स्थल</option>
            <option value="लोकल इकॉनमी">लोकल इकॉनमी</option>
            <option value="हैंडीक्राफ्ट">हैंडीक्राफ्ट</option>
        </select>

        <label>स्थान की कहानी (AI गाइड यही बोलेगा)</label>
        <textarea id="placeStory" rows="4" placeholder="विस्तृत इतिहास और विशेषता लिखें..." required></textarea>

        <button onclick="saveData()">क्लाउड पर सेव करें</button>
        <p id="msg">✅ स्थल सीधे क्लाउड डेटाबेस में सुरक्षित हो गया!</p>
    </div>

    <script src="admin.js"></script>
    <script>
        const adminDistricts = {
            "Bihar": ["Muzaffarpur", "Patna", "Gaya", "Darbhanga", "Bhagalpur", "Vaishali"],
            "Punjab": ["Amritsar", "Ludhiana", "Jalandhar", "Patiala"],
            "Uttar Pradesh": ["Varanasi", "Ayodhya", "Lucknow", "Agra", "Mathura"]
        };

        function updateDistrictOptions() {
            const st = document.getElementById("placeState").value;
            const dist = document.getElementById("placeDistrict");
            dist.innerHTML = "";
            adminDistricts[st].forEach(d => {
                const opt = document.createElement("option");
                opt.value = d;
                opt.innerText = d;
                dist.appendChild(opt);
            });
        }
    </script>
</body>
</html>
