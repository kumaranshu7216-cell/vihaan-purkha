<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>एडमिन पैनल - विहान पुरखा</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #f0f2f5; 
            padding: 20px; 
        }
        .admin-box { 
            background: white; 
            max-width: 400px; 
            margin: 0 auto; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        }
        input, select, textarea { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 15px; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 14px;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #d35400;
            outline: none;
        }
        button { 
            width: 100%; 
            padding: 14px; 
            background: #d35400; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 16px;
            transition: background 0.3s ease;
        }
        button:hover { 
            background: #b84a00; 
        }
    </style>
</head>
<body>
    <div class="admin-box">
        <h2 style="color: #d35400; text-align: center; margin-bottom: 20px;">नया ऐतिहासिक स्थल जोड़ें</h2>
        
        <!-- नया एडमिन ID फील्ड -->
        <input type="text" id="adminId" placeholder="आपका एडमिन ID (जैसे: @spidey_ahamiyat)" required>
        
        <input type="text" id="placeId" placeholder="स्थान की ID (जैसे: lnmcbm_startup)" required>
        <input type="text" id="placeName" placeholder="स्थान का नाम (जैसे: LNMCBM स्टार्टअप सेल)" required>
        
        <select id="placeCategory">
            <option value="ऐतिहासिक स्थल">ऐतिहासिक स्थल</option>
            <option value="धार्मिक स्थल">धार्मिक स्थल</option>
            <option value="लोकल इकॉनमी">लोकल इकॉनमी</option>
        </select>

        <textarea id="placeStory" rows="4" placeholder="AI गाइड के लिए कहानी लिखें..." required></textarea>
        
        <button onclick="saveData()">डेटा सेव करें</button>
        
        <p id="msg" style="color: #28a745; text-align: center; display: none; margin-top: 15px; font-weight: bold;">
            ✅ डेटा सफलतापूर्वक जुड़ गया!
        </p>
    </div>

    <!-- जावास्क्रिप्ट फाइल को लिंक करना -->
    <script src="admin.js"></script>
</body>
</html>
