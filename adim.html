<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>विहान पुरखा - एडमिन कंसोल</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: #f1f5f9; 
            padding: 16px; 
            margin: 0; 
            display: flex;
            justify-content: center;
        }
        .admin-card { 
            background: #ffffff; 
            width: 100%;
            max-width: 440px; 
            padding: 26px 20px; 
            border-radius: 24px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
            border: 1px solid #e2e8f0;
            color: #0f172a;
        }
        .logo-box {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 22px;
        }
        .logo-icon {
            width: 46px;
            height: 46px;
            background: linear-gradient(135deg, #d35400, #f39c12);
            color: white;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 900;
            box-shadow: 0 4px 12px rgba(211, 84, 0, 0.3);
        }
        h2 { 
            margin: 0; 
            font-size: 1.4rem; 
            font-weight: 800; 
            background: linear-gradient(90deg, #d35400, #f39c12);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .sub { font-size: 0.8rem; color: #64748b; margin: 0; }
        
        label { font-size: 12px; font-weight: 700; color: #334155; display: block; margin-top: 14px; margin-bottom: 5px; }
        input, select, textarea { 
            width: 100%; 
            padding: 11px 13px; 
            border: 1.5px solid #cbd5e1; 
            border-radius: 12px; 
            box-sizing: border-box; 
            font-size: 13px; 
            outline: none; 
            background: #f8fafc;
            color: #0f172a;
        }
        input:focus, textarea:focus, select:focus { border-color: #d35400; background: #fff; }
        .row-grid { display: flex; gap: 8px; }
        .row-grid div { flex: 1; }
        
        .upload-preview {
            width: 100%;
            height: 140px;
            border: 2px dashed #cbd5e1;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 6px;
            overflow: hidden;
            background: #f8fafc;
        }
        .upload-preview img { width: 100%; height: 100%; object-fit: cover; display: none; }
        
        button { 
            width: 100%; 
            padding: 14px; 
            margin-top: 22px; 
            background: linear-gradient(135deg, #d35400, #f39c12); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            font-weight: 800; 
            font-size: 15px; 
            box-shadow: 0 4px 14px rgba(211, 84, 0, 0.3); 
        }
        #msg { color: #16a34a; text-align: center; display: none; margin-top: 14px; font-weight: 800; font-size: 13px; }
    </style>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="admin-card">
        <div class="logo-box">
            <div class="logo-icon">वि</div>
            <div>
                <h2>विहान पुरखा</h2>
                <p class="sub">मोबाइल एडमिन कंसोल</p>
            </div>
        </div>

        <label>एडमिन हैंडल</label>
        <input type="text" id="adminId" value="@spidey_ahamiyat" required>

        <label>स्थान ID (Unique ID बिना स्पेस के, जैसे: garibnath_mandir)</label>
        <input type="text" id="placeId" placeholder="garibnath_mandir" required>

        <label>स्थान का नाम</label>
        <input type="text" id="placeName" placeholder="बाबा गरीबनाथ मंदिर" required>

        <div class="row-grid">
            <div>
                <label>राज्य (State)</label>
                <select id="placeState" onchange="updateDistrictOptions()">
                    <option value="Bihar">Bihar</option>
                    <option value="Punjab">Punjab</option>
                    <option value="Uttar Pradesh">Uttar Pradesh</option>
                </select>
            </div>
            <div>
                <label>ज़िला (District)</label>
                <select id="placeDistrict">
                    <option value="Muzaffarpur">Muzaffarpur</option>
                    <option value="Patna">Patna</option>
                    <option value="Gaya">Gaya</option>
                    <option value="Vaishali">Vaishali</option>
                    <option value="Darbhanga">Darbhanga</option>
                    <option value="Bhagalpur">Bhagalpur</option>
                </select>
            </div>
        </div>

        <label>गाँव / कस्बा / इलाका</label>
        <input type="text" id="placeVillage" placeholder="पुरानी बाज़ार" required>

        <label>स्थान की असली फ़ोटो अपलोड करें</label>
        <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)">
        <div class="upload-preview" id="previewContainer">
            <span id="previewPlaceholder" style="color: #94a3b8; font-size: 12px;">फ़ोटो चुनें</span>
            <img id="imgPreview" alt="Preview">
        </div>

        <label>श्रेणी (Category)</label>
        <select id="placeCategory">
            <option value="धार्मिक स्थल">धार्मिक स्थल</option>
            <option value="ऐतिहासिक स्थल">ऐतिहासिक स्थल</option>
            <option value="लोकल इकॉनमी">लोकल इकॉनमी</option>
            <option value="हैंडीक्राफ्ट">हैंडीक्राफ्ट</option>
        </select>

        <label>स्थान की कहानी (AI गाइड यही बोलेगा)</label>
        <textarea id="placeStory" rows="4" placeholder="विस्तृत इतिहास और विशेषता लिखें..." required></textarea>

        <button onclick="saveData()">क्लाउड पर सुरक्षित करें</button>
        <p id="msg">✅ स्थल सीधे क्लाउड डेटाबेस में सुरक्षित हो गया!</p>
    </div>

    <script src="admin.js"></script>
    <script>
        const adminDistricts = {
            "Bihar": ["Muzaffarpur", "Patna", "Gaya", "Vaishali", "Darbhanga", "Bhagalpur"],
            "Punjab": ["Amritsar", "Patiala", "Ludhiana", "Jalandhar"],
            "Uttar Pradesh": ["Ayodhya", "Varanasi", "Agra", "Mathura", "Lucknow"]
        };

        function updateDistrictOptions() {
            const st = document.getElementById("placeState").value;
            const dist = document.getElementById("placeDistrict");
            dist.innerHTML = "";
            adminDistricts[st].forEach(d => {
                const opt = document.createElement("option");
                opt.value = d;
                opt.innerText = d;
                dist.appendChild(opt);
            });
        }
    </script>
</body>
</html>
