<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>एडमिन पैनल - विहान पुरखा</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #f0f2f5; 
            padding: 20px; 
            margin: 0;
        }
        .admin-box { 
            background: white; 
            max-width: 420px; 
            margin: 30px auto; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        }
        h2 { 
            color: #d35400; 
            text-align: center; 
            margin-bottom: 20px; 
        }
        input, select, textarea { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 15px; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 14px; 
        }
        button { 
            width: 100%; 
            padding: 14px; 
            background: #d35400; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 16px; 
            transition: background 0.3s;
        }
        button:hover {
            background: #b04300;
        }
        #msg { 
            color: #28a745; 
            text-align: center; 
            display: none; 
            margin-top: 15px; 
            font-weight: bold; 
        }
    </style>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="admin-box">
        <h2>नया स्थल जोड़ें (Cloud)</h2>
        <input type="text" id="adminId" placeholder="एडमिन ID (जैसे: @spidey_ahamiyat)" required>
        <input type="text" id="placeId" placeholder="स्थान ID (जैसे: garibnath_temple)" required>
        <input type="text" id="placeName" placeholder="स्थान का नाम" required>
        <select id="placeCategory">
            <option value="धार्मिक स्थल">धार्मिक स्थल</option>
            <option value="ऐतिहासिक स्थल">ऐतिहासिक स्थल</option>
            <option value="लोकल इकॉनमी">लोकल इकॉनमी</option>
            <option value="हैंडीक्राफ्ट">हैंडीक्राफ्ट</option>
        </select>
        <textarea id="placeStory" rows="4" placeholder="स्थान की कहानी लिखें (AI गाइड यही बोलेगा)..." required></textarea>
        <button onclick="saveData()">क्लाउड पर सुरक्षित करें</button>
        <p id="msg">✅ डेटा सीधे क्लाउड पर सुरक्षित हो गया!</p>
    </div>

    <script src="admin.js"></script>
</body>
</html>
